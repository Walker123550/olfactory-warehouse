[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "olfactory-warehouse"
version = "0.1.0"
description = "A local olfactory note-taking app modeled with warehouse-style dimensions and facts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
olfactory-warehouse = "olfactory_warehouse.app:run"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
olfactory_warehouse = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
